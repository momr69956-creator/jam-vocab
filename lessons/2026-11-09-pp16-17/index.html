<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whiteboard pp. 16–17</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Scheherazade+New:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#FAF8F4; --surface:#FFFFFF; --ink:#1F1D1A; --ink-2:#4A463F; --muted:#8B857A;
  --line:#E9E4DB; --line-soft:#F1ECE4; --track:#EFEAE1;
  --accent:#0F6F5C; --accent-ink:#0B5748; --accent-soft:#E6F1ED;
  --bad:#B0442F; --bad-soft:#FBEDE9;
  --sans:"Instrument Sans", ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  --arabic:"Scheherazade New", "Scheherazade", "Noto Naskh Arabic", "Geeza Pro", "Traditional Arabic", serif;
  --shadow:0 1px 2px rgba(31,29,26,.05), 0 8px 24px -12px rgba(31,29,26,.12);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.ar{font-family:var(--arabic);direction:rtl;unicode-bidi:isolate;color:var(--ink);font-weight:600}
/* Keep each of two forms whole on one line; a phrase on its own wraps between words as normal. */
.ar.pair .form{white-space:nowrap}
.tile .ar{max-width:100%;overflow-wrap:break-word}
.ar .sep{color:#C9C2B6;font-weight:400}
/* Two forms where the Arabic is large: masculine above feminine, no dangling slash. */
.tile .ar.pair,.fc-face .ar.pair,.q-subject .ar.pair{display:flex;flex-direction:column;align-items:center}
.tile .ar.pair .sep,.fc-face .ar.pair .sep,.q-subject .ar.pair .sep{display:none}
.tile .ar.pair{font-size:40px;line-height:1.3}
.tr{font-style:italic;color:var(--muted);direction:ltr;unicode-bidi:isolate}
body.hide-tr .tr{display:none}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding:16px 24px 14px;display:flex;align-items:center;gap:14px 24px;flex-wrap:wrap}
.brand{margin-right:auto;min-width:0}
.brand h1{margin:0;font-size:21px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.brand .meta{margin-top:3px;font-size:10.5px;font-weight:500;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.seg{display:flex;gap:2px;background:var(--track);padding:3px;border-radius:9px}
.seg button{padding:6px 16px;border-radius:7px;font-size:14px;font-weight:500;color:var(--ink-2);transition:background .15s,color .15s}
.seg button:hover{color:var(--ink)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(31,29,26,.10)}
.speed{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2)}
.speed[hidden]{display:none}
.speed .seg button{padding:5px 11px;font-size:13.5px;font-variant-numeric:tabular-nums}
.sw{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--ink-2);cursor:pointer;user-select:none}
.sw input{position:absolute;opacity:0;width:0;height:0}
.box{width:16px;height:16px;border-radius:4px;border:1.5px solid #C9C2B6;background:var(--surface);display:grid;place-items:center;flex:none;transition:background .12s,border-color .12s}
.box svg{opacity:0;width:10px;height:10px}
.sw input:checked + .box{background:var(--accent);border-color:var(--accent)}
.sw input:checked + .box svg{opacity:1}
.sw input:focus-visible + .box{outline:2px solid var(--accent);outline-offset:2px}

main{max-width:1080px;margin:0 auto;padding:30px 24px 90px}
.sec-h{margin:8px 0 14px;font-size:11px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.sec-h .ar{font-size:24px;letter-spacing:0;text-transform:none;color:var(--ink-2);font-weight:500}
.sec + .sec{margin-top:34px}

/* word tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  min-height:168px;padding:24px 14px 16px;text-align:center;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;box-shadow:var(--shadow);transition:border-color .15s,background .15s,transform .12s}
.tile:hover{border-color:#D5CEC2}
.tile:active{transform:scale(.985)}
.tile .ar{font-size:46px;line-height:1.45}
.tile .tr{font-size:15.5px;margin-top:8px;line-height:1.3}
.tile .en{margin-top:10px;padding-top:9px;border-top:1px solid var(--line-soft);width:100%;font-size:14px;color:var(--ink-2);line-height:1.35}
.tile .en small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.tile .spk{position:absolute;top:10px;left:10px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--accent);background:var(--accent-soft)}
.tile .spk svg{width:14px;height:14px}
.tile.on{border-color:var(--accent);background:#F6FBF9}
.tile.on .spk{background:var(--accent);color:#fff;animation:pulse 1s ease-in-out infinite}
.tile[aria-disabled="true"] .spk{opacity:.3}
@keyframes pulse{50%{transform:scale(1.12)}}

/* buttons */
.play{width:44px;height:44px;flex:none;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;transition:transform .12s,background .15s}
.play:hover{background:#D8E9E3}
.play:active{transform:scale(.92)}
.play.on{background:var(--accent);color:#fff}
.play svg{width:19px;height:19px}
.play[disabled]{opacity:.3;cursor:not-allowed}
.play.sm{width:34px;height:34px}
.play.sm svg{width:15px;height:15px}
.btn{padding:9px 18px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;color:var(--ink-2);transition:border-color .15s,color .15s,background .15s}
.btn:hover{border-color:#D5CEC2;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* flashcards */
.fc-stage{display:flex;flex-direction:column;align-items:center;gap:18px;max-width:560px;margin:0 auto}
.fc-opts{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.fc-opts .seg button{padding:4px 12px;font-size:13px}
.fc{width:100%;perspective:1400px;cursor:pointer}
.fc-inner{display:grid;transition:transform .5s cubic-bezier(.4,.1,.2,1);transform-style:preserve-3d}
.fc.flipped .fc-inner{transform:rotateY(180deg)}
.fc-face{grid-area:1/1;min-height:300px;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);
  border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:38px 26px 26px;position:relative;text-align:center}
.fc-back{transform:rotateY(180deg)}
.fc-face .tag{position:absolute;top:14px;left:18px;font-size:10px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.fc-face .ar{font-size:76px;line-height:1.3}
.fc-face .tr{font-size:19px;margin-top:10px}
.fc-face .ar.ref{font-size:40px}
.fc-face .tr.ref{font-size:15px}
.fc-en{font-size:28px;font-weight:600;line-height:1.25;text-wrap:balance}
.fc-note{font-size:14px;color:var(--muted)}
.fc-hint{font-size:12.5px;color:#B3ACA0;margin-top:6px}
.fc-face .play{margin-top:10px}
.fc-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.fc-pos{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:62px;text-align:center}
.bar{width:100%;height:3px;background:var(--track);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}

/* quiz */
.quiz{max-width:640px;margin:0 auto}
.q-top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px}
.q-step{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.q-score{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.quiz .bar{margin-bottom:22px}
.q-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:var(--shadow)}
.q-prompt{font-size:13px;color:var(--muted);text-align:center;margin-bottom:10px}
.q-subject{display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:22px;text-align:center}
.q-subject .ar{font-size:62px;line-height:1.3}
.q-subject .tr{font-size:18px;margin-top:8px}
.q-subject .play{margin-top:6px}
.q-en{font-size:26px;font-weight:600;line-height:1.3;text-wrap:balance}
.q-subject .play.big{width:72px;height:72px;margin-top:0}
.q-subject .play.big svg{width:30px;height:30px}
.opts{display:grid;gap:9px}
.opts.ar-opts{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 16px;border:1px solid var(--line);border-radius:11px;background:var(--surface);font-size:16px;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:#C6BFB2;background:#FDFCFA}
.opt .k{font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:5px;width:20px;height:20px;display:grid;place-items:center;flex:none}
.opt .body{flex:1;min-width:0;display:flex;flex-direction:column}
.ar-opts .opt .body{align-items:center;text-align:center}
.opt .ar{font-size:36px;line-height:1.4}
.opt .tr{font-size:14px;margin-top:7px}
.opt.right{border-color:var(--accent);background:var(--accent-soft)}
.opt.right .k{border-color:var(--accent);color:var(--accent)}
.opt.wrong{border-color:#E2B8AC;background:var(--bad-soft)}
.opt.wrong .k{border-color:#E2B8AC;color:var(--bad)}
.opt:disabled{cursor:default}
.q-foot{margin-top:18px;display:flex;align-items:center;gap:14px;min-height:44px}
.q-verdict{flex:1;font-size:14px;font-weight:600}
.q-verdict.right{color:var(--accent)}
.q-verdict.wrong{color:var(--bad)}
.q-verdict .ans{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-weight:400;color:var(--ink-2);margin-top:2px}
.q-verdict .ans .ar{font-size:28px;line-height:1.3}
.q-verdict .ans .tr{font-size:14px}
.result{text-align:center;padding:10px 0}
.result .big{font-size:52px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.result .of{font-size:15px;color:var(--muted)}
.result .line{font-size:15px;color:var(--ink-2);margin:16px auto 18px}
.missed{text-align:left;border-top:1px solid var(--line-soft);padding-top:14px;display:grid;gap:4px}
.missed .m{display:flex;align-items:center;gap:14px;padding:6px 0}
.missed .m .ar{font-size:32px;line-height:1.45}
.missed .m .tx{flex:1;display:flex;flex-direction:column}
.missed .m .tr{font-size:14px}
.missed .m .mean{font-size:14.5px;color:var(--ink-2)}
.empty{padding:34px;text-align:center;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);max-width:min(92vw,460px);padding:12px 16px;border-radius:10px;background:var(--ink);color:#fff;font-size:14px;line-height:1.4;text-align:center;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:640px){
  .top-in{padding:12px 16px}
  .brand{width:100%}
  main{padding:22px 16px 70px}
  .tiles{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .tile{min-height:148px;padding:22px 10px 12px}
  .tile .ar{font-size:39px}
  .tile .ar.pair{font-size:35px}
  .tile .tr{font-size:14px}
  .tile .en{font-size:13.5px}
  .fc-face{min-height:270px}
  .fc-face .ar{font-size:62px}
  .q-card{padding:20px 16px}
  .q-subject .ar{font-size:52px}
  .opt{padding:10px 12px}
  .opt .ar{font-size:32px}
  .opts.ar-opts{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important}}
.home-link{display:inline-flex;align-items:center;gap:6px;margin-bottom:4px;font-size:13px;font-weight:500;color:var(--accent);text-decoration:none}.home-link:hover{color:var(--accent-ink);text-decoration:underline}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><a class="home-link" href="../../">&larr; All of Jam&rsquo;s lessons</a><h1 id="title"></h1><div class="meta" id="meta"></div></div>
    <div class="seg" role="tablist" aria-label="View" id="views">
      <button role="tab" data-view="words" aria-selected="true">Words</button>
      <button role="tab" data-view="cards" aria-selected="false">Flashcards</button>
      <button role="tab" data-view="quiz" aria-selected="false">Quiz</button>
    </div>
    <div class="speed" role="group" aria-label="Playback speed" id="speed"><span class="speed-l">Speed</span><div class="seg" id="speedSeg"></div></div>
    <label class="sw"><input type="checkbox" id="tgTr"><span class="box"><svg viewBox="0 0 12 12" fill="none"><path d="M2 6.4 4.6 9 10 3.2" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Hide transliteration</label>
  </div>
</header>
<main id="main"></main>

// AUDIO holds one list of base64 MP3 clips per speed ({"1": [...], "0.8": [...], "0.6": [...]}).
// The slower ones are time-stretched at build time, so pitch stays natural and every
// playback method below, Web Audio included, gets the same slowed clip.
const CLIPS = Array.isArray(AUDIO) ? {"1": AUDIO} : AUDIO;
const SPEEDS = Object.keys(CLIPS).map(Number).sort((a, b) => b - a);
let speed = 1;
try { const v = localStorage.getItem("vocab-speed"); if(v && CLIPS[v]) speed = Number(v); } catch(e){}
const has = i => !!CLIPS["1"][i];
const clip = i => (CLIPS[String(speed)] || CLIPS["1"])[i] || CLIPS["1"][i];

const ITEMS = [];
DATA.sections.forEach((s, si) => s.rows.forEach(r => ITEMS.push({
  i: ITEMS.length, sec: si, ar: r.ar, tr: r.tr, en: r.en, note: r.note || ""
})));

/* ---------- audio ----------
   Three ways to play a clip, tried in order until one works, then kept for the rest of the
   visit: a blob: URL, a data: URL, then Web Audio. App previews and some hosts block blob:
   or every media URL with a security policy; Web Audio decodes the bytes itself and isn't
   covered by that policy. Nothing fails silently: if all three fail, a message says so. */
const player = new Audio();
const MODES = ["blob", "data", "webaudio"];
let mode = 0;
const urls = {}, bufs = {};
const key = i => speed + ":" + i;
let playingEl = null, seq = 0, actx = null, src = null;
try { if(navigator.audioSession) navigator.audioSession.type = "playback"; } catch(e){}
function bytes(i){
  const bin = atob(clip(i)), u8 = new Uint8Array(bin.length);
  for(let k = 0; k < bin.length; k++) u8[k] = bin.charCodeAt(k);
  return u8;
}
function urlFor(i){
  const k = key(i);
  if(!urls[k]) urls[k] = URL.createObjectURL(new Blob([bytes(i)], {type:"audio/mpeg"}));
  return urls[k];
}
function ensureCtx(){
  if(!actx){ const C = window.AudioContext || window.webkitAudioContext; if(C) actx = new C(); }
  if(actx && actx.state === "suspended") actx.resume();
  return actx;
}
function stop(){
  player.pause();
  if(src){ try { src.onended = null; src.stop(); } catch(e){} src = null; }
  if(playingEl){ playingEl.classList.remove("on"); playingEl = null; }
}
function finished(mine){ if(mine === seq && playingEl){ playingEl.classList.remove("on"); playingEl = null; } }
function play(i, el){
  if(!has(i)) return;
  const mine = ++seq;
  stop();
  if(el){ el.classList.add("on"); playingEl = el; }
  if(MODES[mode] === "webaudio") ensureCtx();   // inside the tap, so the browser lets it start
  attempt(i, mine);
}
function attempt(i, mine){
  if(MODES[mode] === "webaudio") return playWebAudio(i, mine);
  let failed = false;
  const fail = e => {
    if(failed || mine !== seq) return;
    failed = true;
    player.pause();
    if(e && e.name === "NotAllowedError"){ finished(mine); return; }   // needs a fresh tap, not a new method
    if(mode < MODES.length - 1){
      mode++;
      if(MODES[mode] === "webaudio") ensureCtx();
      attempt(i, mine);
    } else { finished(mine); blocked(); }
  };
  player.onended = () => finished(mine);
  player.onerror = () => fail();
  try {
    player.src = MODES[mode] === "blob" ? urlFor(i) : "data:audio/mpeg;base64," + clip(i);
    const p = player.play();
    if(p && p.catch) p.catch(fail);
  } catch(e){ fail(e); }
}
function decode(ctx, i){
  const buf = bytes(i).buffer;
  return new Promise((res, rej) => {
    const r = ctx.decodeAudioData(buf, res, rej);
    if(r && r.then) r.then(res, rej);
  });
}
async function playWebAudio(i, mine){
  const ctx = ensureCtx();
  if(!ctx){ finished(mine); blocked(); return; }
  try {
    const k = key(i);
    if(!bufs[k]) bufs[k] = await decode(ctx, i);
    if(mine !== seq) return;
    if(ctx.state === "suspended") await ctx.resume();
    const s = ctx.createBufferSource();
    s.buffer = bufs[k];
    s.connect(ctx.destination);
    s.onended = () => { if(src === s) src = null; finished(mine); };
    src = s;
    s.start();
  } catch(e){ finished(mine); blocked(); }
}
let toastTimer = null;
function blocked(){
  let t = document.querySelector(".toast");
  if(!t){ t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = "Sound is blocked where this page is open. Open it in Chrome or Safari to listen.";
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 7000);
}
window.__audioState = () => ({ mode: MODES[mode], speed, playing: !!src || (!player.paused && !player.error && !player.ended), ctx: actx ? actx.state : null });
const SPK = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M11 5 6.5 9H3v6h3.5L11 19V5Z" fill="currentColor"/><path d="M15.6 8.6a4.6 4.6 0 0 1 0 6.8M18.4 5.8a8.5 8.5 0 0 1 0 12.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
function playBtn(i, cls){
  const b = document.createElement("button");
  b.className = "play" + (cls ? " " + cls : "");
  b.innerHTML = SPK;
  b.setAttribute("aria-label", "Play " + ITEMS[i].en);
  if(!has(i)) b.disabled = true;
  b.addEventListener("click", e => { e.stopPropagation(); play(i, b); });
  return b;
}

/* ---------- little builders ---------- */
function el(tag, cls, text){ const n = document.createElement(tag); if(cls) n.className = cls; if(text != null) n.textContent = text; return n; }
function arSpan(text, cls){
  const s = el("span", "ar" + (cls ? " " + cls : ""));
  s.lang = "ar"; s.dir = "rtl";
  // Two forms (كبير / كبيرة): keep each form whole so a line never breaks inside one.
  const forms = String(text).split(/\s*\/\s*/);
  if(forms.length > 1) s.classList.add("pair");
  forms.forEach((f, k) => {
    if(k) s.appendChild(el("span", "sep", " / "));
    s.appendChild(el("span", "form", f));
  });
  return s;
}
function trSpan(text, cls){ return el("span", "tr" + (cls ? " " + cls : ""), text); }
const meaning = it => it.en + (it.note ? " (" + it.note + ")" : "");
function shuffled(n){ const a = [...Array(n).keys()]; for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ---------- state ---------- */
const state = { view:"words", card:0, flipped:false, order:null, front:"ar" };
let quiz = null;

document.getElementById("views").addEventListener("click", e => {
  const b = e.target.closest("button[data-view]");
  if(!b || b.dataset.view === state.view) return;
  state.view = b.dataset.view;
  [...e.currentTarget.children].forEach(x => x.setAttribute("aria-selected", x === b));
  render();
});
const tg = document.getElementById("tgTr");
try { tg.checked = localStorage.getItem("vocab-hide-tr") === "1"; } catch(e){}
document.body.classList.toggle("hide-tr", tg.checked);
tg.addEventListener("change", () => {
  document.body.classList.toggle("hide-tr", tg.checked);
  try { localStorage.setItem("vocab-hide-tr", tg.checked ? "1" : "0"); } catch(e){}
});
const speedSeg = document.getElementById("speedSeg");
if(SPEEDS.length < 2 || !ITEMS.some(it => has(it.i))) document.getElementById("speed").hidden = true;
SPEEDS.forEach(v => {
  const b = el("button", "", v + "×");
  b.type = "button";
  b.dataset.speed = String(v);
  b.setAttribute("aria-label", v === 1 ? "Normal speed" : "Slower: " + v + " times");
  b.addEventListener("click", () => {
    if(speed === v) return;
    stop();
    speed = v;
    try { localStorage.setItem("vocab-speed", String(v)); } catch(e){}
    syncSpeed();
  });
  speedSeg.appendChild(b);
});
function syncSpeed(){ [...speedSeg.children].forEach(b => b.setAttribute("aria-selected", Number(b.dataset.speed) === speed)); }
syncSpeed();

/* ---------- words ---------- */
function viewWords(root){
  DATA.sections.forEach((s, si) => {
    const sec = el("section", "sec");
    if(s.heading){
      const h = el("h2", "sec-h");
      if(/[؀-ۿ]/.test(s.heading)) h.appendChild(arSpan(s.heading)); else h.textContent = s.heading;
      sec.appendChild(h);
    }
    const grid = el("div", "tiles");
    ITEMS.filter(it => it.sec === si).forEach(it => {
      const t = el("button", "tile");
      t.type = "button";
      t.setAttribute("aria-label", it.en + " — play");
      if(!has(it.i)) t.setAttribute("aria-disabled", "true");
      const spk = el("span", "spk"); spk.innerHTML = SPK;
      const en = el("span", "en", it.en);
      if(it.note) en.appendChild(el("small", "", it.note));
      t.append(spk, arSpan(it.ar), trSpan(it.tr), en);
      t.addEventListener("click", () => play(it.i, t));
      grid.appendChild(t);
    });
    sec.appendChild(grid);
    root.appendChild(sec);
  });
}

/* ---------- flashcards ---------- */
function viewCards(root){
  const n = ITEMS.length;
  if(!state.order) state.order = [...Array(n).keys()];
  const stage = el("div", "fc-stage");

  const opts = el("div", "fc-opts");
  opts.appendChild(el("span", "", "Front:"));
  const seg = el("div", "seg");
  [["ar", "Arabic"], ["en", "Meaning"]].forEach(([k, label]) => {
    const b = el("button", "", label);
    b.setAttribute("aria-selected", state.front === k);
    b.addEventListener("click", () => { if(state.front === k) return; state.front = k; state.flipped = false; render(); });
    seg.appendChild(b);
  });
  opts.appendChild(seg);

  const fc = el("div", "fc");
  fc.tabIndex = 0;
  fc.setAttribute("role", "button");
  const inner = el("div", "fc-inner");
  const front = el("div", "fc-face fc-front"), back = el("div", "fc-face fc-back");
  inner.append(front, back);
  fc.appendChild(inner);

  const bar = el("div", "bar"); bar.innerHTML = "<i></i>";
  const controls = el("div", "fc-controls");
  const prev = el("button", "btn", "← Back"), pos = el("div", "fc-pos"),
        next = el("button", "btn primary", "Next →"), shuf = el("button", "btn", "Shuffle");
  controls.append(prev, pos, next, shuf);
  stage.append(opts, fc, bar, controls);
  root.appendChild(stage);

  function arabicFace(face, it, hint){
    face.appendChild(el("span", "tag", "Arabic"));
    face.append(arSpan(it.ar), trSpan(it.tr));
    face.appendChild(playBtn(it.i));
    if(hint) face.appendChild(el("div", "fc-hint", "Say it, then tap to check the meaning"));
  }
  function meaningFace(face, it, hint, withRef){
    face.appendChild(el("span", "tag", "Meaning"));
    if(withRef){ face.append(arSpan(it.ar, "ref"), trSpan(it.tr, "ref")); }
    face.appendChild(el("div", "fc-en", it.en));
    if(it.note) face.appendChild(el("div", "fc-note", it.note));
    if(withRef) face.appendChild(playBtn(it.i, "sm"));
    if(hint) face.appendChild(el("div", "fc-hint", "Say it in Arabic, then tap to check"));
  }
  function draw(autoplay){
    const it = ITEMS[state.order[state.card]];
    front.innerHTML = ""; back.innerHTML = "";
    if(state.front === "ar"){ arabicFace(front, it, true); meaningFace(back, it, false, true); }
    else { meaningFace(front, it, true, false); arabicFace(back, it, false); }
    fc.classList.toggle("flipped", state.flipped);
    pos.textContent = (state.card + 1) + " / " + n;
    bar.querySelector("i").style.width = ((state.card + 1) / n * 100) + "%";
    prev.disabled = state.card === 0;
    next.disabled = state.card === n - 1;
    fc.setAttribute("aria-label", "Card " + (state.card + 1) + ". Activate to flip.");
    const arVisible = (state.front === "ar") !== state.flipped;
    if(autoplay && arVisible){
      const face = state.flipped ? back : front;
      play(it.i, face.querySelector(".play"));
    }
  }
  function flip(){ state.flipped = !state.flipped; draw(true); }
  function go(step){ const k = state.card + step; if(k < 0 || k >= n) return; state.card = k; state.flipped = false; draw(true); }
  fc.addEventListener("click", flip);
  fc.addEventListener("keydown", e => { if(e.key === " " || e.key === "Enter"){ e.preventDefault(); flip(); } });
  prev.addEventListener("click", () => go(-1));
  next.addEventListener("click", () => go(1));
  shuf.addEventListener("click", () => { state.order = shuffled(n); state.card = 0; state.flipped = false; draw(true); });
  draw(true);
  root._keys = e => {
    if(e.key === "ArrowRight") go(1);
    else if(e.key === "ArrowLeft") go(-1);
  };
}

/* ---------- quiz ---------- */
const QN = 10;
function buildQuiz(){
  const order = shuffled(ITEMS.length).slice(0, Math.min(QN, ITEMS.length));
  const kinds = ["listen", "ar2en", "en2ar"];
  return { at:0, score:0, qs: order.map((idx, k) => {
    const target = ITEMS[idx];
    let kind = kinds[k % 3];
    if(kind === "listen" && !has(target.i)) kind = "en2ar";
    const pool = ITEMS.filter(it => it.en !== target.en && it.ar !== target.ar);
    const picks = shuffled(pool.length).slice(0, 3).map(j => pool[j]);
    const all = [target, ...picks];
    return { kind, target, opts: shuffled(all.length).map(j => all[j]), answer:null };
  })};
}
function viewQuiz(root){
  if(ITEMS.length < 2){ root.appendChild(el("div", "empty", "The quiz needs at least two words.")); return; }
  if(!quiz) quiz = buildQuiz();
  const wrap = el("div", "quiz");
  root.appendChild(wrap);
  drawQuiz(wrap);
}
function drawQuiz(wrap){
  wrap.innerHTML = "";
  if(quiz.at >= quiz.qs.length){ drawResult(wrap); return; }
  const q = quiz.qs[quiz.at];
  const top = el("div", "q-top");
  top.append(el("div", "q-step", "Question " + (quiz.at + 1) + " of " + quiz.qs.length), el("div", "q-score", quiz.score + " correct"));
  const bar = el("div", "bar"); bar.innerHTML = '<i style="width:' + (quiz.at / quiz.qs.length * 100) + '%"></i>';
  const card = el("div", "q-card");
  const subject = el("div", "q-subject");
  let prompt;
  if(q.kind === "listen"){
    prompt = "Listen — which word is it?";
    const b = playBtn(q.target.i, "big");
    subject.appendChild(b);
    setTimeout(() => play(q.target.i, b), 250);
  } else if(q.kind === "ar2en"){
    prompt = "What does this mean?";
    subject.append(arSpan(q.target.ar), trSpan(q.target.tr), playBtn(q.target.i, "sm"));
  } else {
    prompt = "Which one means…";
    subject.appendChild(el("div", "q-en", meaning(q.target)));
  }
  const arOpts = q.kind !== "ar2en";
  const opts = el("div", "opts" + (arOpts ? " ar-opts" : ""));
  q.opts.forEach((o, k) => {
    const b = el("button", "opt");
    const body = el("span", "body");
    if(arOpts) body.append(arSpan(o.ar), trSpan(o.tr)); else body.textContent = meaning(o);
    b.append(el("span", "k", "ABCD"[k]), body);
    b.addEventListener("click", () => answer(wrap, k));
    opts.appendChild(b);
  });
  card.append(el("div", "q-prompt", prompt), subject, opts, el("div", "q-foot"));
  wrap.append(top, bar, card);
}
function answer(wrap, k){
  const q = quiz.qs[quiz.at];
  if(q.answer !== null) return;
  q.answer = k;
  const ok = q.opts[k] === q.target;
  if(ok) quiz.score++;
  [...wrap.querySelectorAll(".opt")].forEach((b, j) => {
    b.disabled = true;
    if(q.opts[j] === q.target) b.classList.add("right");
    else if(j === k) b.classList.add("wrong");
  });
  const foot = wrap.querySelector(".q-foot");
  const v = el("div", "q-verdict " + (ok ? "right" : "wrong"), ok ? "Correct" : "Not quite");
  const ans = el("div", "ans");
  ans.append(arSpan(q.target.ar), trSpan(q.target.tr), el("span", "", "— " + meaning(q.target)));
  v.appendChild(ans);
  const nextBtn = el("button", "btn primary", quiz.at === quiz.qs.length - 1 ? "See score" : "Next →");
  nextBtn.addEventListener("click", () => { quiz.at++; drawQuiz(wrap); });
  foot.append(v, playBtn(q.target.i, "sm"), nextBtn);
  wrap.querySelector(".q-score").textContent = quiz.score + " correct";
  nextBtn.focus();
}
function drawResult(wrap){
  const total = quiz.qs.length;
  const missed = quiz.qs.filter(q => q.opts[q.answer] !== q.target).map(q => q.target);
  const card = el("div", "q-card"), res = el("div", "result");
  res.append(el("div", "big", String(quiz.score)), el("div", "of", "out of " + total),
             el("div", "line", missed.length ? "Listen to these again:" : "Every one right."));
  if(missed.length){
    const m = el("div", "missed");
    missed.forEach(t => {
      const row = el("div", "m");
      const tx = el("div", "tx");
      tx.append(trSpan(t.tr), el("span", "mean", meaning(t)));
      row.append(playBtn(t.i, "sm"), tx, arSpan(t.ar));
      m.appendChild(row);
    });
    res.appendChild(m);
  }
  const again = el("button", "btn primary", "Try again");
  again.style.marginTop = "22px";
  again.addEventListener("click", () => { quiz = buildQuiz(); drawQuiz(wrap); });
  res.appendChild(again);
  card.appendChild(res);
  wrap.appendChild(card);
}

/* ---------- render ---------- */
const main = document.getElementById("main");
let keyHandler = null;
function render(){
  stop();
  if(keyHandler){ document.removeEventListener("keydown", keyHandler); keyHandler = null; }
  main.innerHTML = "";
  if(state.view === "words") viewWords(main);
  else if(state.view === "cards"){ viewCards(main); keyHandler = main._keys; document.addEventListener("keydown", keyHandler); }
  else { quiz = null; viewQuiz(main); }
  window.scrollTo(0, 0);
}
document.getElementById("title").textContent = DATA.title;
document.getElementById("meta").textContent = [DATA.student, ITEMS.length + " words"].filter(Boolean).join(" · ");
render();
</script>
<style>.tile .ar{overflow-wrap:normal}</style>
<script>
(function(){
  function fit(){
    document.querySelectorAll('.tile .ar').forEach(function(el){
      el.style.fontSize='';
      var fs=parseFloat(getComputedStyle(el).fontSize), n=0;
      while(el.scrollWidth>el.clientWidth+1 && fs>20 && n<40){fs-=1; el.style.fontSize=fs+'px'; n++;}
    });
  }
  var t; function later(){clearTimeout(t); t=setTimeout(fit,50);}
  window.addEventListener('resize', later);
  if(document.fonts && document.fonts.ready){document.fonts.ready.then(fit);}
  var m=document.getElementById('main');
  if(m && window.MutationObserver){new MutationObserver(later).observe(m,{childList:true,subtree:true});}
  fit();
})();
</script>
